<html lang="uk">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Навколосвітня куля жартів 😄</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    #globeViz { width:100%; height:100%; cursor: grab; }
    .tooltip {
      color : white;
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 260px;
      line-height: 1.4em;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="tooltip" class="tooltip" style="display:none"></div>

  <!-- Three.js & helpers -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three-globe@2.44.0/dist/three-globe.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <script>
  (async () => {
    // DOM refs
    const globeContainer = document.getElementById('globeViz');
    const tooltip = document.getElementById('tooltip');

    // Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 250;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    globeContainer.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 120;
    controls.maxDistance = 400;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 3, 5);
    scene.add(dirLight);

    // Initialize globe with basic settings
    const globe = new ThreeGlobe({ animateIn: true })
      .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-day.jpg')
      .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png');
    
        scene.add(globe);

    // Add Polygons for country borders
    let countriesBorders = [];
    try {
      const res = await fetch('https://raw.githubusercontent.com/vasturiano/react-globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson');
      const data = await res.json();
      countriesBorders = data.features;
      // Assign a random color to each country border
      countriesBorders.forEach(f => {
        f.properties.borderColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      });
    } catch (e) {
      console.error('Error fetching country polygons:', e);
    }

    let hoveredPolygon = null;
    let clickedPolygon = null;

    globe
      .polygonsData(countriesBorders)
      .polygonCapColor(feat => feat === clickedPolygon ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0.001)') // Transparent fill
      .polygonSideColor(feat => feat === hoveredPolygon ? 'rgba(255, 0, 0, 0.8)' : (feat.properties.borderColor || '#0f0'))
      .polygonStrokeColor(feat => feat === hoveredPolygon ? 'red' : (feat.properties.borderColor || '#0f0'))
      .polygonAltitude(feat => feat === hoveredPolygon ? 0.02 : 0.01)
      .polygonsTransitionDuration(0);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Mouse move handler for hovering
    renderer.domElement.addEventListener('mousemove', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(globe, true);

      const intersectData = intersects.find(d => d.object.__data)?.object.__data;
      const newHoveredPolygon = (intersectData && intersectData.properties) ? intersectData : null;

      globeContainer.style.cursor = newHoveredPolygon ? 'pointer' : 'grab';

      if (newHoveredPolygon !== hoveredPolygon) {
        hoveredPolygon = newHoveredPolygon;
        globe.polygonSideColor(globe.polygonSideColor())
             .polygonStrokeColor(globe.polygonStrokeColor())
             .polygonAltitude(globe.polygonAltitude());
      }
    });

    // Click handler
    renderer.domElement.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(globe, true);

      const intersectData = intersects.find(d => d.object.__data)?.object.__data;

      if (intersectData) {
        // It's a point (capital) if it has a joke method
        if (typeof intersectData.joke === 'function') {
          tooltip.style.display = 'block';
          tooltip.style.left = `${event.clientX + 5}px`;
          tooltip.style.top = `${event.clientY + 5}px`;
          tooltip.innerHTML = intersectData.joke();
        }
        // It's a polygon if it has a properties object
        else if (intersectData.properties) {
          if (intersectData !== clickedPolygon) {
            clickedPolygon = intersectData;
          }
          tooltip.style.display = 'none'; // Hide tooltip if a country is clicked
        }
      } else {
        // Clicked on globe/ocean
        clickedPolygon = null;
        tooltip.style.display = 'none';
      }
      
      // Update polygon colors
      globe.polygonCapColor(globe.polygonCapColor());
    });

    // Fetch capitals data

    countries.forEach(c => {
      if (!c.capital || (!c.capitalInfo?.latlng && !c.latlng) || !c.cca2) return; // need coords and cca2
      const [lat, lng] = c.capitalInfo?.latlng || c.latlng;
      if (lat === undefined || lng === undefined) return;

      points.push({
        lat,
        lng,
        size: 0.6,
        color: 'red',
        country: c.translations?.ukr?.common || c.name.common,
        capital: Array.isArray(c.capital) ? c.capital[0] : c.capital,
        cca2: c.cca2,
        joke() {
          const specificJoke = countryJokes[this.cca2];
          if (specificJoke) {
            return specificJoke;
          }
          return `У країні ${this.country} кажуть, що у столиці ${this.capital} навіть голуби користуються GPS!`;
        }
      });
    });

    // Add points to globe
    globe
      .pointsData(points)
      .pointAltitude(0.1) // larger for debugging
      .pointRadius(0.5) // larger for debugging
      .pointLat('lat')
      .pointLng('lng')
      .pointColor('color');

    

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      });

    // Animation loop
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  })();
